<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0c10">
<meta name="mobile-web-app-capable" content="yes">
<title>Redline Ridge</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
    background: #0a0c10; overscroll-behavior: none; }
  #app, #app canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #app { touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; }
  #fatal { display: none; position: fixed; inset: 0; z-index: 9999; background: #0a0c10;
    color: #e8e8e8; font: 16px/1.5 system-ui, sans-serif; padding: 32px; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app"></div>
<div id="fatal"><h2>Redline Ridge failed to start</h2><p id="fatal-msg"></p></div>
<noscript><div style="color:#fff;padding:32px;font-family:system-ui">Redline Ridge needs JavaScript.</div></noscript>
<script type="module">
  try {
    const { boot } = await import('./js/main.js');
    await boot();
  } catch (err) {
    console.error(err);
    document.getElementById('fatal').style.display = 'block';
    document.getElementById('fatal-msg').textContent = String(err && err.message || err);
  }
</script>
</body>
</html>
